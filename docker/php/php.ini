; PHP 8.1 Custom Configuration for Loudisland
; Optimized for production scalable deployment

[PHP]
; Memory & Execution
memory_limit          = 256M
max_execution_time    = 300
max_input_time        = 300
max_input_vars        = 5000

; File Upload
upload_max_filesize   = 50M
post_max_size         = 50M
file_uploads          = On

; Error handling (disable display in production)
display_errors        = Off
display_startup_errors = Off
log_errors            = On
error_reporting       = E_ALL & ~E_DEPRECATED & ~E_STRICT

; OPcache - critical for performance across multiple containers
[opcache]
opcache.enable              = 1
opcache.enable_cli          = 0
opcache.memory_consumption  = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0    ; disable in production (rebuild image on deploy)
opcache.save_comments       = 1
opcache.revalidate_freq     = 0
opcache.fast_shutdown       = 1

; Session
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure   = 0   ; set to 1 when HTTPS is enabled
