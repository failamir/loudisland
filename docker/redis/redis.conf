# Redis 7.2 configuration for Loudisland
# Role: Session Store + Cache + Pub/Sub Chat Channel

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence - AOF
appendonly yes
appendfilename "redis.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshot
save 900 1
save 300 10
save 60 10000

# Connection
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Databases (0=default, 1=cache, 2=session, 3=pubsub)
databases 16

# Logging
loglevel notice
logfile ""
