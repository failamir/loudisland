# Redis configuration for Loudisland
# Serves as: Session Store + Cache + Pub/Sub Chat Channel

# ─────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no    # Docker network is isolated; auth protects instead

# ─────────────────────────────────────────────
# Authentication
# ─────────────────────────────────────────────
# requirepass change_me_in_production

# ─────────────────────────────────────────────
# Memory
# ─────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru   # Evict LRU keys when memory full

# ─────────────────────────────────────────────
# Persistence — AOF (Append Only File)
# Ensures chat messages & session data survive restart
# ─────────────────────────────────────────────
appendonly yes
appendfilename "redis.aof"
appendfsync everysec          # Balance durability vs performance
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshot (backup)
save 900 1
save 300 10
save 60 10000

# ─────────────────────────────────────────────
# Pub/Sub (Chat Channel)
# ─────────────────────────────────────────────
# No special config needed — pub/sub is built-in
# Laravel broadcasting uses: redis-cli SUBSCRIBE / PUBLISH
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─────────────────────────────────────────────
# Databases
# DB 0 = default / general
# DB 1 = cache
# DB 2 = sessions
# DB 3 = pub/sub tracking
# ─────────────────────────────────────────────
databases 16

# Logging
loglevel notice
logfile ""
