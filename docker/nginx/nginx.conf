user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ─────────────────────────────────────────
    # Performance
    # ─────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript text/xml application/xml font/woff2;

    # ─────────────────────────────────────────
    # PHP-FPM upstream pool (Round Robin LB)
    # All 4 containers receive equal traffic
    # ─────────────────────────────────────────
    upstream laravel_app {
        least_conn;                     # Least-connection load balancing
        server app1:9000 weight=1;
        server app2:9000 weight=1;
        server app3:9000 weight=1;
        server app4:9000 weight=1;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}
