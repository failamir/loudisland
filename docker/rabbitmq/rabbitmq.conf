## RabbitMQ Configuration for Loudisland
## Role: Asynchronous Event Task Queue

# Networking
listeners.tcp.default = 5672

# Management Plugin
management.tcp.port = 15672

# Memory
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 500MB

# Heartbeat / Timeouts
heartbeat = 60
frame_max = 131072

# Logging
log.console = true
log.console.level = info
log.file.level = info
