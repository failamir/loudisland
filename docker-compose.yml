version: "3.9"

# ============================================================
#  PROPOSED SCALABLE REAL-TIME BACKEND ARCHITECTURE
#  Project   : Loudisland / Qiscus
#  Author    : Fail Amir Abdullah, M.Kom.
#  Stack     : Nginx LB → 4x PHP-FPM → Redis + RabbitMQ → MySQL Cluster
# ============================================================

networks:
  loudisland_net:
    driver: bridge

volumes:
  mysql_master_data:
  mysql_slave_data:
  redis_data:
  rabbitmq_data:
  storage_data:

services:

  # ─────────────────────────────────────────────
  #  NGINX LOAD BALANCER
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: loudisland_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      - app1
      - app2
      - app3
      - app4
    networks:
      - loudisland_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  #  PHP-FPM APP CONTAINERS (4 replicas)
  # ─────────────────────────────────────────────
  app1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: loudisland_app1
    restart: unless-stopped
    environment:
      CONTAINER_NAME: app1
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - storage_data:/var/www/html/storage
    depends_on:
      - mysql-master
      - redis
      - rabbitmq
    networks:
      - loudisland_net

  app2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: loudisland_app2
    restart: unless-stopped
    environment:
      CONTAINER_NAME: app2
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - storage_data:/var/www/html/storage
    depends_on:
      - mysql-master
      - redis
      - rabbitmq
    networks:
      - loudisland_net

  app3:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: loudisland_app3
    restart: unless-stopped
    environment:
      CONTAINER_NAME: app3
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - storage_data:/var/www/html/storage
    depends_on:
      - mysql-master
      - redis
      - rabbitmq
    networks:
      - loudisland_net

  app4:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: loudisland_app4
    restart: unless-stopped
    environment:
      CONTAINER_NAME: app4
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - storage_data:/var/www/html/storage
    depends_on:
      - mysql-master
      - redis
      - rabbitmq
    networks:
      - loudisland_net

  # ─────────────────────────────────────────────
  #  BACKGROUND WORKER SERVICE
  #  Processes RabbitMQ queued jobs asynchronously
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: loudisland_worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      - mysql-master
      - redis
      - rabbitmq
    networks:
      - loudisland_net

  # ─────────────────────────────────────────────
  #  MYSQL MASTER (Write)
  # ─────────────────────────────────────────────
  mysql-master:
    image: mysql:8.0
    container_name: loudisland_mysql_master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-loudisland}
      MYSQL_USER: ${DB_USERNAME:-loudisland}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./docker/mysql/master/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/master/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "3306:3306"
    networks:
      - loudisland_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  #  MYSQL SLAVE (Read Replica)
  # ─────────────────────────────────────────────
  mysql-slave:
    image: mysql:8.0
    container_name: loudisland_mysql_slave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-loudisland}
      MYSQL_USER: ${DB_USERNAME:-loudisland}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./docker/mysql/slave/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "3307:3306"
    depends_on:
      mysql-master:
        condition: service_healthy
    networks:
      - loudisland_net

  # ─────────────────────────────────────────────
  #  REDIS — Memory Cache + Pub/Sub Chat Channel
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: loudisland_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - loudisland_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  #  RABBITMQ — Asynchronous Event Task Queue
  # ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: loudisland_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-loudisland}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    networks:
      - loudisland_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
